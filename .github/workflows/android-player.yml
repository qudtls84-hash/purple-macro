name: 퍼플매크로 플레이어 APK

on:
  push:
    branches: [android-player]
    paths: ['android-player/**', '.github/workflows/android-player.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 만들기
        run: gradle -p android-player assembleRelease --no-daemon --stacktrace

      - name: 이름 정리
        run: cp android-player/app/build/outputs/apk/release/app-release.apk PurplePlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PurplePlayer
          path: PurplePlayer.apk

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="player-v${{ github.run_number }}"
          gh release create "$TAG" PurplePlayer.apk \
            --target "${{ github.sha }}" \
            --title "퍼플매크로 플레이어 v1.0.${{ github.run_number }}" \
            --notes "태블릿에서 이 페이지의 PurplePlayer.apk를 눌러 내려받아 설치하세요." \
            --latest

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ttangja.purpleplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ttangja.purpleplayer'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        player {
            storeFile file('player.keystore')
            storePassword 'purpleplayer'
            keyAlias 'player'
            keyPassword 'purpleplayer'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.player
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
